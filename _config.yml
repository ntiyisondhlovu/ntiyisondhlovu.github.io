title: Ntiyiso Wayne Ndhlovu
description: Business Analyst in Johannesburg focused on process and operational analysis, through people, process and technology.
author: Ntiyiso Wayne Ndhlovu
url: https://ntiyisondhlovu.github.io
baseurl: ""
lang: en
timezone: Africa/Johannesburg
markdown: kramdown
permalink: /blog/:year/:month/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
feed:
  path: blog/feed.xml
twitter:
  card: summary_large_image
social:
  name: Ntiyiso Wayne Ndhlovu
  links:
    - https://www.linkedin.com/in/ntiyiso-ndhlovu-840048129/
    - https://github.com/ntiyisondhlovu
defaults:
  - scope: { path: "" }
    values: { image: /assets/images/share-card.jpg }
  - scope: { path: "", type: posts }
    values: { layout: post }
exclude:
  - README.md
  - POSTING.md
  - _templates
